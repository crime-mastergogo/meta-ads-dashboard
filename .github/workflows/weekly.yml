name: Weekly Meta Ads Report

on:
  schedule:
    # Every Monday 9:00 AM IST = 03:30 UTC
    - cron: "30 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

# Share the publishing lock with the Daily dashboard workflow.
concurrency:
  group: dashboard-publish
  cancel-in-progress: false

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Update the checkout before generating files, not after.
      - name: Sync with latest main
        run: git pull --rebase origin main

      - name: Pull statics data from Meta API
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_ACCOUNT_ID: ${{ secrets.META_ACCOUNT_ID }}
        run: python main_statics.py

      - name: Pull videos data from Meta API
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_ACCOUNT_ID: ${{ secrets.META_ACCOUNT_ID }}
        run: python main_videos.py

      - name: Generate weekly report without sending Slack yet
        env:
          SKIP_WEEKLY_SLACK: "1"
        run: python generate_weekly.py

      # Only the weekly report files are committed here. Daily owns the shared
      # dashboard JSON and top-level dashboard HTML files.
      - name: Commit and publish weekly report
        run: |
          git config user.name "xyxx-ads-bot"
          git config user.email "actions@github.com"
          git add docs/weekly/
          git diff --staged --quiet || git commit -m "Weekly report: $(date -u +%Y-W%W)"
